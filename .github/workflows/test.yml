name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in under a second; five minutes covers a slow runner start.
    timeout-minutes: 5
    name: script tests (Node ${{ matrix.node }})
    strategy:
      matrix:
        # 22.18 is the oldest Node that runs the scripts' TypeScript without a
        # flag, and 24 is the current LTS.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # The scripts have no dependencies, so there is nothing to install.
      - run: node --test "plugins/**/__tests__/*.test.mts"
